# dsh-role-guard bundle patch.
#
# `insert` is pure-append and the loader rejects duplicate entry ids: a profile
# adds this plugin through `dsh.profile.bundles` only, then overrides
# parameters with a top-level `- id: role-guard` + `config:` block.
- insert:
    - id: role-guard
      name: 'dsh-role-guard'
      config:
        enabled: true
        logFile: '~/.dsh/role-guard.log'
