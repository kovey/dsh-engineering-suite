# dsh-interaction-gate bundle patch.
#
# `insert` is pure-append and the loader rejects duplicate entry ids, so the row
# uses the plugin's short id (`interaction-gate`) — a profile overrides parameters
# with a top-level `- id: interaction-gate` + `config:` block.
#
# Where a decision is DELIVERED (which channel) and the overridable keys live in
# `<repo>/.dsh/interaction-gate.json`, which spec-gate's trust root keeps out of
# the model's reach. Who may answer is HOST-owned (`im.approvers` inline ids /
# `im.approversFile`, default `~/.dsh/interaction-approvers.txt`): a repository
# that could supply its own allowlist would be granting itself permission. How
# long a turn may wait for a human, and whether an approver list is mandatory,
# stay host-owned for the same reason.
#
# The decision ledger is NOT pinned here: it follows the layout root (`ledgerFile`
# defaults to the empty string and is resolved per workspace), because a literal
# `.dsh/interaction/decisions.jsonl` default made a migrated repository's
# decisions invisible to every later turn that read the ledger back.
- insert:
    - id: interaction-gate
      name: 'dsh-interaction-gate'
      config:
        enabled: true
        logFile: '~/.dsh/interaction-gate.log'
        askTimeoutMs: 900000
        requireApproverList: false
        notifyLevels: [warn, error]
        preferredChannels: []
        maxPayloadChars: 4000
        redactPatterns: []
        # The optional IM channel (see README「可选 IM 通道」). `auto` is the
        # default: a `chatInteraction` service that appears at ANY time (bundle
        # order does not decide apply order) is used. `required` waits the
        # bounded `requiredWaitMs` before refusing; `off` never touches it.
        im: { channel: auto, requiredWaitMs: 5000 }
        prompt: { enabled: true, order: 600 }
