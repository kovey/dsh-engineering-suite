# dsh-orchestrator bundle patch.
#
# `insert` is pure-append and the loader rejects duplicate entry ids: a profile
# adds this plugin through `dsh.profile.bundles` only, and overrides parameters
# with a top-level `- id: orchestrator` + `config:` block.
- insert:
    - id: orchestrator
      name: 'dsh-orchestrator'
      config:
        enabled: true
        logFile: '~/.dsh/orchestrator.log'
        defaultMaxAttempts: 3
